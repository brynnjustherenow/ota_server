name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0). Leave empty to derive from Cargo.toml (v<version>).'
        required: false
        default: ''
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # 读取 Cargo.toml 版本号，计算 release tag
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute version and tag
        id: meta
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          INPUT_TAG="${{ inputs.tag }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="${INPUT_TAG#v}"
            TAG="v$TAG"
          else
            TAG="v$VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"       >> "$GITHUB_OUTPUT"
          echo "Resolved version=$VERSION tag=$TAG"

  # 构建前端（只构建一次，跨平台静态资源）
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 1

  # 构建 Rust 二进制（矩阵：linux x86_64 / linux aarch64 / windows x86_64）
  build:
    needs: [meta, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: 'true'
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Prepare example config
        shell: bash
        run: |
          {
            echo 'port = 13884'
            echo ''
            echo '[mqtt_conf]'
            echo 'server_host = "broker.emqx.io"'
            echo 'server_post = 1883'
            echo 'cmd_topic = "k230/cam/cmd"'
            echo 'status_topic = "k230/cam/status"'
          } > conf.toml.example

      - name: Install aarch64 cross toolchain
        if: matrix.cross == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          rustflags: ""

      - name: Build (release)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Linux)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          VER="${{ needs.meta.outputs.version }}"
          STAGE="ota_server-${VER}-${{ matrix.target }}"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/ota_server" "$STAGE/"
          cp -r frontend/dist "$STAGE/frontend-dist"
          cp conf.toml.example "$STAGE/"
          tar czf "$STAGE.tar.gz" "$STAGE"
          echo "ASSET=$STAGE.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          VER="${{ needs.meta.outputs.version }}"
          STAGE="ota_server-${VER}-${{ matrix.target }}"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/ota_server.exe" "$STAGE/"
          cp -r frontend/dist "$STAGE/frontend-dist"
          cp conf.toml.example "$STAGE/"
          7z a "$STAGE.zip" "$STAGE"
          echo "ASSET=$STAGE.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: ${{ env.ASSET }}
          retention-days: 1

  # 创建 Release 并上传全部资产
  release:
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease }}
          files: |
            ota_server-*.tar.gz
            ota_server-*.zip

  # 发布成功后通过 SSH 自动部署到服务器
  # 暂时禁用：以后启用时删除下面 if: false 这一行即可
  deploy:
    if: false  # 暂时禁用，保留代码待以后启用
    needs: [meta, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download linux release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ needs.meta.outputs.tag }}" \
            -R "$GITHUB_REPOSITORY" \
            --pattern 'ota_server-*-x86_64-unknown-linux-gnu.tar.gz' \
            --dir ./dist
          mv ./dist/ota_server-*-x86_64-unknown-linux-gnu.tar.gz ./ota_server.tar.gz
          ls -la ota_server.tar.gz

      - name: Upload archive to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: ota_server.tar.gz
          target: /tmp/ota_deploy

      - name: Install & restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            DEST="$HOME/ota_server"
            mkdir -p "$DEST"
            # 备份当前二进制，便于失败回滚
            if [ -f "$DEST/ota_server" ]; then
              cp "$DEST/ota_server" "$DEST/ota_server.bak"
            fi
            # 解压到临时目录
            TMP=$(mktemp -d)
            tar xzf /tmp/ota_deploy/ota_server.tar.gz -C "$TMP" --strip-components=1
            # 更新示例配置（不覆盖已存在的 .conf.toml）
            cp -n "$TMP/conf.toml.example" "$DEST/" 2>/dev/null || true
            # 替换二进制
            install -m 0755 "$TMP/ota_server" "$DEST/ota_server"
            # 更新前端静态资源
            rm -rf "$DEST/frontend-dist"
            cp -r "$TMP/frontend-dist" "$DEST/frontend-dist"
            # 重启服务（需在 sudoers 配 NOPASSWD）
            sudo systemctl restart ota_server
            # 健康检查（最多重试 5 次），失败则回滚
            sleep 2
            for i in 1 2 3 4 5; do
              if curl -fsS http://127.0.0.1:13884/health >/dev/null; then
                echo "health OK"
                rm -rf "$TMP" /tmp/ota_deploy
                echo "Deployed ${{ needs.meta.outputs.tag }} successfully"
                exit 0
              fi
              sleep 2
            done
            echo "health check failed, rolling back"
            if [ -f "$DEST/ota_server.bak" ]; then
              install -m 0755 "$DEST/ota_server.bak" "$DEST/ota_server"
              sudo systemctl restart ota_server
            fi
            exit 1
